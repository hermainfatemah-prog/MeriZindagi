<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meri Zindagi Ke Naam ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 12px;
    font-family: "Noto Nastaliq Urdu", "Noto Naskh Arabic", "Segoe UI", serif;
    background: linear-gradient(135deg, #f8eee9, #f4e3df, #fbf5f0);
    color: #4d3733;
}

.box {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 35px 25px;
    background: rgba(255, 250, 247, 0.96);
    border: 1px solid rgba(150, 105, 95, 0.18);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(90, 55, 45, 0.12);
}

h1 {
    text-align: center;
    direction: rtl;
    font-size: 30px;
    font-weight: normal;
    color: #684943;
    margin-bottom: 12px;
}

.box > p {
    text-align: center;
}

input {
    display: block;
    width: 85%;
    max-width: 350px;
    margin: 18px auto;
    padding: 14px 16px;
    border: 1px solid #d5b9b0;
    border-radius: 12px;
    background: #fffdfb;
    font-size: 16px;
    text-align: center;
    outline: none;
}

button {
    display: block;
    margin: auto;
    padding: 13px 28px;
    border: none;
    border-radius: 12px;
    background: #74534b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#error {
    color: #a34f4f;
    display: none;
}

/* LETTER */
#letter {
    display: none;
    margin-top: 35px;
    padding: 32px 25px;
    background: #fffdf9;
    border: 1px solid #eadbd4;
    border-radius: 18px;
    box-shadow: 0 6px 25px rgba(90, 55, 45, 0.08);
    direction: rtl;
    text-align: right;
    line-height: 2.25;
    font-size: 18px;
}

#letter strong {
    display: block;
    text-align: right;
    font-size: 23px;
    color: #694740;
    margin-bottom: 22px;
}

/* PDF button */
#letter a {
    text-decoration: none;
    display: block;
    margin-top: 25px;
}

#letter a button {
    direction: ltr;
}

/* Mobile */
@media (max-width: 600px) {
    body {
        padding: 15px 8px;
    }

    .box {
        padding: 28px 14px;
        border-radius: 18px;
    }

    h1 {
        font-size: 26px;
    }

    #letter {
        padding: 25px 17px;
        font-size: 17px;
        line-height: 2.15;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>مری زندگی کے نام ❤️</h1>

<p>
یہ خط صرف اُس شخص کے لیے ہے جس کے لیے یہ دل لکھتا ہے۔
</p>

<input type="password" id="password" placeholder="Password">

<br>

<button onclick="openLetter()">Open Letter ❤️</button>

<p id="error">Wrong password</p>

<div id="letter">

    <strong>میرے دل،</strong>

    <iframe
        src="./letter.pdf"
        width="100%"
        height="700"
        style="border: none; border-radius: 12px;">
    </iframe>

</div>

</div>

<script>
function openLetter() {

    const password = document.getElementById("password").value;

    if (password === "iloveyoumylove") {
        document.getElementById("letter").style.display = "block";
        document.getElementById("error").style.display = "none";
    } else {
        document.getElementById("error").style.display = "block";
        document.getElementById("letter").style.display = "none";
    }
}
</script>

</body>
</html>
